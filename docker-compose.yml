version: "3.8"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: resume_analyzer_api
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    environment:
      - APP_ENV=docker
      - DATABASE_URL=sqlite:///./data/resume_analyzer.db
    restart: always
